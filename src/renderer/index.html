<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy for the PACKAGED renderer. The app also sets this
      via an onHeadersReceived header, but a header never reaches a file://
      document, so the packaged build relies on this <meta> (the parser enforces
      it regardless of scheme). Keep byte-identical to CSP_POLICY in
      src/shared/csp-policy.ts — tests/unit/renderer/csp-policy-sync.test.ts
      fails on drift.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Command Center</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        /* Theme-aware: rethemes with the picker (was a hardcoded dark Mocha
           #1E1E2E that stayed dark behind the app in light mode). Fallback
           matches the dark default for the pre-stylesheet paint. */
        background: var(--surface-stage, #171e27);
        color: var(--text-primary, #e8e8e8);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
