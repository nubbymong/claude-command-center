<!--
  The app's runtime CSP is delivered by an onHeadersReceived header, which
  does not apply to a file:// document — so this page carries its own CSP as
  a <meta>, which the parser enforces regardless of scheme. Locked down to
  local assets only: no remote origins, no connect (the offline guarantee is
  now enforced, not just observed), no inline/eval script.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'">
<title>AI Code Conductor</title>
<!--
  Animated boot splash, adapted from the brand asset package (2026-08-04).
  Fully self-contained: three.js and the Montserrat subset are vendored next
  to this file (the app CSP has no CDN origins and boot must work offline),
  the brand SVG is inlined below (fetch() is not available on file:// pages),
  and all script lives in ./splash.js because the app CSP has no
  'unsafe-inline' for scripts. The <body> starts as .nojs: if the module
  never executes (or WebGL init fails -> .nofx), CSS shows the static brand
  mark and drives the loading bar instead.
-->
<style>
  html,body{margin:0;height:100%;background:#0b0e15;overflow:hidden;font-family:monospace}
  #stage{position:fixed;inset:0;z-index:1}
  canvas{display:block;width:100%;height:100%}
  #logo{position:fixed;left:0;top:0;z-index:0;opacity:0;pointer-events:none}
  #logo>div{position:absolute;left:0;top:0;width:810px;height:331px;opacity:0;transform-origin:0 0}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.42) 100%)}
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;color:#9fb6e8}
  #bg .frame{position:absolute;inset:26px;border:1px solid rgba(140,170,230,.10)}
  #bg .tick{position:absolute;width:13px;height:13px;opacity:.35}
  #bg .tick::before,#bg .tick::after{content:'';position:absolute;background:rgba(160,190,240,.55)}
  #bg .tick::before{left:6px;top:0;width:1px;height:13px}
  #bg .tick::after{left:0;top:6px;width:13px;height:1px}
  #bg .dot{position:absolute;width:4px;height:4px;transform:rotate(45deg);background:rgba(120,160,230,.35)}
  #rings{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%)}
  #glowline{position:absolute;left:14%;right:14%;top:63.5%;height:1px;background:linear-gradient(90deg,transparent,rgba(90,150,255,.34) 30%,rgba(150,200,255,.6) 50%,rgba(90,150,255,.34) 70%,transparent)}
  #glowline::after{content:'';position:absolute;left:50%;top:-2.5px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);background:#bcd8ff;box-shadow:0 0 12px 3px rgba(120,180,255,.75)}
  #loader{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);width:230px;z-index:3;pointer-events:none}
  #loader .track{height:2px;background:rgba(140,170,230,.14);border-radius:2px;overflow:hidden}
  #loader .fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#1E63D6,#2F9BFF 70%,#9fd0ff);box-shadow:0 0 10px rgba(47,155,255,.55)}
  #loader .lbl{margin-top:9px;text-align:center;font:9px monospace;letter-spacing:.35em;text-indent:.35em;color:rgba(170,195,235,.5)}
  /* Montserrat Italic 600, latin subset — SIL OFL 1.1, self-hosted */
  @font-face{font-family:'Montserrat';font-style:italic;font-weight:600;font-display:swap;src:url('./montserrat-italic-600-latin.woff2') format('woff2')}
  /* Fallbacks: .nojs = module never ran; .nofx = WebGL/init failed */
  #fallback{display:none;position:fixed;inset:0;z-index:1;align-items:center;justify-content:center}
  #fallback svg{width:62%;max-width:560px;height:auto}
  body.nojs #fallback,body.nofx #fallback{display:flex}
  body.nojs #stage,body.nofx #stage,body.nojs #logo,body.nofx #logo{display:none}
  body.nojs #lfill,body.nofx #lfill{animation:lfill 2.9s cubic-bezier(.2,.6,.3,1) forwards}
  @keyframes lfill{from{width:0}to{width:96%}}
</style>
