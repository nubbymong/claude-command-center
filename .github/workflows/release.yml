name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options:
          - stable
          - beta
          - dev
        default: stable
      skip_vt:
        description: 'Skip VirusTotal scan'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: build + sign + verify Windows only — no tag, no release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Build Windows installer ──
  build-windows:
    # Pinned off windows-latest: the new vs2026 image breaks @electron/node-gyp
    # (no supported Visual Studio). Same pin as ci.yml — unpin together.
    runs-on: windows-2025
    env:
      # Presence-gate for Windows code signing (SSL.com eSigner CKA). One flag
      # read by the signing, packaging and verification steps below.
      HAS_SIGNING: ${{ secrets.ES_USERNAME != '' && secrets.ES_PASSWORD != '' && secrets.ES_TOTP_SECRET != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      installer: ${{ steps.version.outputs.installer }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # VS 2026-only runner images break @electron/node-gyp's VS discovery
      # (VS18 absent from its version table). Install VS2022 Build Tools —
      # also covers electron-builder's internal rebuild. See ci.yml.
      - name: Install VS2022 Build Tools
        shell: pwsh
        run: choco install visualstudio2022buildtools --no-progress -y --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre --includeRecommended --quiet --norestart"

      - name: Rebuild native modules
        shell: bash
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Run tests
        run: npx vitest run

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          CHANNEL="${{ inputs.channel }}"
          # When package.json already carries a prerelease suffix (e.g.
          # 2.0.0-beta.1 for numbered betas), the tag IS v${VERSION} — don't
          # append a second -beta. Bare versions keep the channel suffix.
          if [[ "$VERSION" == *-* ]]; then
            TAG="v${VERSION}"
          else
            case "$CHANNEL" in
              beta) TAG="v${VERSION}-beta" ;;
              dev)  TAG="v${VERSION}-dev"  ;;
              *)    TAG="v${VERSION}"      ;;
            esac
          fi
          INSTALLER="ClaudeCommandCenter-${VERSION}.exe"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "installer=${INSTALLER}" >> $GITHUB_OUTPUT
          echo "Building v${VERSION} (tag: ${TAG}, channel: ${CHANNEL})"

      - name: Build
        run: npm run build

      # ── Windows code signing: SSL.com eSigner CKA (cloud HSM) ──
      # The signing key lives in SSL.com's cloud HSM and never exists as a file
      # on the runner. CKA registers a Windows KSP so the key appears in the
      # user certificate store; electron-builder's normal signtool path then
      # signs DURING packaging. That placement is load-bearing: latest.yml's
      # sha512, the .blockmap and CHECKSUMS.txt all hash the final signed
      # binary — signing after packaging would silently break auto-update.
      - name: Set up code signing (eSigner CKA)
        id: esigner
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Pinned release + SHA-256 of the installer, verified before running.
          $url = 'https://github.com/SSLcom/eSignerCKA/releases/download/v1.1.2/SSL.COM.eSigner.CKA_1.1.2_build_202600624.exe'
          $sha = '3F088403139505DDFB0ED3B56B72893F92C865F98B382753A1E1C695A5CECE35'
          $setup = Join-Path $env:RUNNER_TEMP 'eSignerCKA-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($actual -ne $sha) { throw "eSigner CKA download hash mismatch: got $actual" }
          $dir = Join-Path $env:RUNNER_TEMP 'eSignerCKA'
          Start-Process $setup -ArgumentList '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES',"/DIR=$dir" -Wait
          Get-ChildItem $dir -Filter '*.exe' | ForEach-Object { Write-Host "installed: $($_.Name)" }
          $tool = @('eSignerCKATool.exe', 'eSignerCKA.exe') |
            ForEach-Object { Join-Path $dir $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $tool) { throw "eSigner CKA CLI not found in $dir" }
          & $tool config -mode product -user $env:ES_USERNAME -pass $env:ES_PASSWORD -totp $env:ES_TOTP_SECRET -key (Join-Path $dir 'master.key') -r
          & $tool unload
          & $tool load
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert |
            Where-Object { $_.Subject -like '*CN=Nicholas Moger*' } | Select-Object -First 1
          if (-not $cert) { throw 'eSigner CKA loaded no matching code-signing certificate into the store' }
          Write-Host "Certificate loaded: $($cert.Subject) [$($cert.Thumbprint)]"
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Package Windows installer
        shell: pwsh
        env:
          SIGN_THUMBPRINT: ${{ steps.esigner.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extra = @()
          if ($env:HAS_SIGNING -eq 'true') {
            if (-not $env:SIGN_THUMBPRINT) { throw 'Signing is enabled but no certificate thumbprint was captured' }
            # Hash algorithm, timestamp server and publisherName come from
            # build.win.signtoolOptions in package.json; only the thumbprint is
            # injected here so unsigned local/dev builds stay possible.
            $extra += "-c.win.signtoolOptions.certificateSha1=$env:SIGN_THUMBPRINT"
          }
          npx electron-builder --win --publish never @extra

      # Fail loudly rather than ever ship unsigned again: a stable/beta release
      # with signing secrets missing is an error, not a fallback.
      # Template values (installer name, channel) are passed via env: rather than
      # interpolated into the pwsh source, so a crafted package.json version can
      # never break out of the string into runner code (GitHub run-step hardening).
      - name: Verify Windows signature
        shell: pwsh
        env:
          INSTALLER: ${{ steps.version.outputs.installer }}
          CHANNEL: ${{ inputs.channel }}
          SIGN_THUMBPRINT: ${{ steps.esigner.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "dist/$env:INSTALLER"
          $sig = Get-AuthenticodeSignature $exe
          if ($env:HAS_SIGNING -eq 'true') {
            if ($sig.Status -ne 'Valid') { throw "Signature on $exe is $($sig.Status): $($sig.StatusMessage)" }
            # Pin the exact leaf we loaded, not a CN substring — a CN substring
            # would also accept e.g. 'CN=Nicholas Moger Ltd' or a second SSL.com
            # customer. The thumbprint was captured from the loaded cert.
            if (-not $env:SIGN_THUMBPRINT) { throw 'Signing enabled but no certificate thumbprint was captured' }
            if ($sig.SignerCertificate.Thumbprint -ne $env:SIGN_THUMBPRINT) { throw "Unexpected signer thumbprint $($sig.SignerCertificate.Thumbprint), expected $env:SIGN_THUMBPRINT" }
            if ($sig.SignerCertificate.Subject -notlike '*CN=Nicholas Moger*') { throw "Unexpected signer: $($sig.SignerCertificate.Subject)" }
            if (-not $sig.TimeStamperCertificate) { throw 'Signature carries no RFC3161 timestamp' }
            Write-Host "Signed OK: $exe"
            Write-Host "  signer:    $($sig.SignerCertificate.Subject)"
            Write-Host "  timestamp: $($sig.TimeStamperCertificate.Subject)"
          } elseif ($env:CHANNEL -ne 'dev') {
            throw "Refusing to build an unsigned '$env:CHANNEL' release: signing secrets are not configured"
          } else {
            Write-Host 'dev build left unsigned (signing secrets not configured)'
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          # exe + blockmap + latest.yml travel together: latest.yml carries the
          # exe's sha512, so replacing one without the others breaks the updater
          # (matters for rolling re-releases onto an existing tag).
          path: |
            dist/${{ steps.version.outputs.installer }}
            dist/${{ steps.version.outputs.installer }}.blockmap
            dist/latest.yml
          if-no-files-found: error

  # ── Build macOS app ──
  build-macos:
    if: ${{ !inputs.dry_run }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Rebuild native modules
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Build
        run: npm run build

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k $KEYCHAIN_PATH \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add to search list
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

          # Verify
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Package macOS DMG
        env:
          CSC_KEYCHAIN: ${{ runner.temp }}/build.keychain-db
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.ELECTRON }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg --publish never

      - name: Determine DMG filename
        id: dmg
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          echo "path=${DMG}" >> $GITHUB_OUTPUT
          echo "name=$(basename ${DMG})" >> $GITHUB_OUTPUT

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  # ── Build Linux AppImage (experimental) ──
  # Unsigned: Linux has no SmartScreen/Gatekeeper equivalent, and AppImage
  # carries no signing convention. CHECKSUMS.txt lets users verify the download
  # by hand — the in-app updater verifies every download against it (#111).
  # Built on ubuntu-latest (glibc 2.39), so the AppImage runs on distros at that
  # glibc or newer: Ubuntu 24.04+, Rocky 10+, Fedora 40+. Older lines (Rocky
  # 8/9, Ubuntu 22.04) need a container build against an older glibc — out of
  # scope for now.
  #
  # continue-on-error: this is an EXPERIMENTAL third platform, so a Linux build
  # failure must never block the Windows/macOS release. The job still shows red
  # in the run (visible to the maintainer), and release.js flags the missing
  # AppImage asset — but the release proceeds with the platforms that built.
  build-linux:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Rebuild native modules
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      # The only place the vitest suite runs on Linux (CI's PR matrix is
      # Win+macOS). Note this is the standard suite — the *.native.test.ts
      # files (better-sqlite3 under Electron-as-Node) are excluded by
      # vitest.config; the native rebuild above is what proves node-pty /
      # better-sqlite3 link on linux-x64.
      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Package Linux AppImage
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

  # ── Create GitHub Release ──
  release:
    # dry_run stops here by construction: no tag, no release, no client impact.
    if: ${{ !inputs.dry_run }}
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Derive the release body from src/renderer/changelog.ts (the single
      # source of truth). Empty output = no changelog entry for this version;
      # the create step then falls back to the checksums-only note.
      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.build-windows.outputs.version }}"
          node scripts/gen-changelog.js --notes "$VERSION" > RELEASE_NOTES.md || true
          if [ -s RELEASE_NOTES.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Release notes for v${VERSION}:"
            cat RELEASE_NOTES.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No changelog.ts entry for v${VERSION} - using checksums-only note."
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: artifacts/

      # continue-on-error mirrors build-linux: if the experimental Linux build
      # failed, its artifact won't exist — download it best-effort so the
      # Windows/macOS release still publishes.
      - name: Download Linux artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      # Publish each installer a second time under the current brand name, so a
      # fresh download carries no legacy name. The ClaudeCommandCenter-* copies
      # MUST stay: every installed client matches release assets by that literal
      # prefix, and latest*.yml still points at them, so removing them would
      # strand existing installs on "no update available". Only the installers
      # are duplicated — .blockmap and latest*.yml are updater-internal and are
      # resolved by name from the legacy asset.
      - name: Add cleanly-named download copies
        run: |
          cd artifacts
          for f in *.exe *.dmg *.AppImage; do
            [ -e "$f" ] || continue
            clean="${f/ClaudeCommandCenter-/AI-Code-Conductor-}"
            if [ "$clean" != "$f" ]; then
              cp -- "$f" "$clean"
              echo "added $clean"
            fi
          done
          ls -la

      # Runs AFTER the copies so users can verify whichever name they downloaded.
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Create GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build-windows.outputs.tag }}"
          VERSION="${{ needs.build-windows.outputs.version }}"
          CHANNEL="${{ inputs.channel }}"

          TITLE="${TAG}"
          # Display names only. Asset filenames deliberately keep the
          # ClaudeCommandCenter- prefix (the updater in every installed client
          # matches release assets by that literal prefix; renaming them
          # strands existing installs silently).
          case "$CHANNEL" in
            stable)
              RELEASE_NAME="AI Code Conductor"
              LABEL="**Stable Release**"
              ;;
            beta)
              RELEASE_NAME="AI Code Conductor Beta"
              LABEL="**Beta Release** (pre-release)"
              ;;
            dev)
              RELEASE_NAME="AI Code Conductor Dev"
              LABEL="**Dev Release** (experimental)"
              ;;
            *)
              RELEASE_NAME="AI Code Conductor ${CHANNEL}"
              LABEL="**${CHANNEL} Release**"
              ;;
          esac
          # Assemble the release body: title + channel label + generated notes
          # (or a checksums-only fallback), then the checksums pointer. Written
          # to a file so multi-line markdown survives intact (--notes-file).
          {
            echo "## ${RELEASE_NAME} v${VERSION}"
            echo ""
            echo "${LABEL}"
            echo ""
            if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
              cat RELEASE_NOTES.md
              echo ""
            fi
            echo "---"
            echo "Installer files keep the ClaudeCommandCenter- name so existing installs keep receiving updates."
            echo ""
            echo "AI Code Conductor is an independent community project — not affiliated with or endorsed by Anthropic. Claude and Claude Code are Anthropic trademarks."
            echo ""
            echo "SHA-256 checksums are in CHECKSUMS.txt attached to this release."
          } > RELEASE_BODY.md

          # Tag stable as latest release; beta and dev are pre-releases
          PRERELEASE_FLAG=""
          if [ "$CHANNEL" != "stable" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Rolling re-release support (v2 beta policy): if the tag's release
          # already exists, REPLACE its assets instead of failing, and leave
          # the existing hand-written release notes untouched.
          # Passing --draft below turns OFF gh's own duplicate-tag pre-check (it
          # only runs for a non-draft create), so this probe is now the ONLY
          # guard against creating a second release for a tag that already has
          # one. It must therefore fail CLOSED: `--state` distinguishes a real
          # "release not found" from an API error and exits non-zero on the
          # latter. Inferring absence from an outage would create an orphan
          # draft holding the new build while the live release keeps serving the
          # old one — green job, nothing shipped.
          # --retry-absent because here, and only here, "absent" AUTHORISES a
          # write. gh maps just HTTP 404 to not-found, so one spurious or
          # replica-lagged 404 would fork a second release for a tag that
          # already has one.
          STATE=$(node scripts/verify-release-manifest.js --state "${TAG}" --retry-absent) || {
            echo "::error::Could not determine whether a release already exists for ${TAG}. Refusing to guess."
            echo "fresh=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          }
          echo "Existing release state for ${TAG}: ${STATE}"

          # A leftover DRAFT takes the re-release path too — that is how a run
          # that drafted and then failed gets repaired and published.
          if [ "$STATE" != "absent" ]; then
            echo "Release ${TAG} exists - replacing assets (rolling re-release)"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            gh release upload "${TAG}" artifacts/* --clobber
          else
            # --target pins the tag to the commit we actually built ($GITHUB_SHA
            # = the dispatched beta ref). WITHOUT it, `gh release create` tags the
            # DEFAULT branch (main), which is frozen at an old commit — GitHub then
            # derives the release's created_at from that stale commit's date, and
            # the in-app updater (which fetches releases in created_at order) never
            # sees the new beta. See src/main/github-update.ts.
            #
            # --draft so no client can see the release until the manifest gate
            # below passes. `checkGitHubRelease` skips drafts outright
            # (github-update.ts), and `created_at` is the TARGET COMMIT's date,
            # not the publish date, so deferring publication cannot strand the
            # release the way a stale --target would.
            #
            # Note what --draft COSTS: `gh release create` normally drafts
            # internally while uploading and DELETES the draft if an upload
            # fails (`draftWhileUploading` in cli/cli). Passing --draft
            # explicitly disables that cleanup, so a failed upload leaves a
            # partial draft behind. The "Clean up a failed draft" step below
            # replaces it.
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            gh release create "${TAG}" $PRERELEASE_FLAG --draft \
              --target "$GITHUB_SHA" \
              --title "${TITLE}" \
              --notes-file RELEASE_BODY.md \
              artifacts/*
          fi

      # A create that failed part-way now leaves a partial draft behind (see the
      # --draft note above), and a leftover draft is the entry point to the worst
      # failure mode this job has: the next run finds it, takes the re-release
      # path, and never publishes. Remove it so a re-run starts clean. No
      # --cleanup-tag: a draft has no tag.
      - name: Clean up a failed draft
        if: ${{ failure() && steps.publish.outputs.fresh == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          # `fresh=true` is what this run INTENDED, not what exists. Never
          # delete on intent alone: confirm the thing in front of us is actually
          # a draft. Otherwise a run that thought the tag was free — and was
          # wrong — deletes a live published release, assets and notes included.
          STATE=$(node scripts/verify-release-manifest.js --state "$TAG") || STATE=unknown
          if [ "$STATE" = "draft" ]; then
            echo "::warning::Release creation failed — deleting the partial draft ${TAG}."
            gh release delete "$TAG" --yes || echo "::warning::Could not delete the draft ${TAG}."
          else
            echo "::warning::${TAG} is '${STATE}', not a draft — refusing to delete it."
          fi

      # VT runs BEFORE the manifest gate on purpose: it scans the local
      # artifacts/, not the release, so it is independent of the gate's verdict —
      # and if the gate ran first, a manifest problem would silently take malware
      # scanning down with it for that release.
      #
      # continue-on-error because VT is ADVISORY: it produces links, not a
      # verdict. Without it, a VirusTotal outage fails the step, skips the
      # publish, and strands a perfectly good verified release as a draft.
      - name: VirusTotal scan
        continue-on-error: true
        if: ${{ !inputs.skip_vt }}
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "Skipping VT scan (no API key)"
            exit 0
          fi
          # Get upload URL for large files
          UPLOAD_URL=$(curl -s --request GET \
            --url "https://www.virustotal.com/api/v3/files/upload_url" \
            --header "x-apikey: ${VT_API_KEY}" | jq -r '.data')

          # Scan each installer (EXE + DMG + AppImage)
          for FILE in artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage; do
            [ -f "$FILE" ] || continue
            echo "Uploading $(basename $FILE) to VirusTotal..."
            RESULT=$(curl -s --request POST \
              --url "${UPLOAD_URL}" \
              --header "x-apikey: ${VT_API_KEY}" \
              --form "file=@${FILE}")
            ANALYSIS_ID=$(echo "$RESULT" | jq -r '.data.id // empty')
            if [ -n "$ANALYSIS_ID" ]; then
              echo "  VirusTotal: https://www.virustotal.com/gui/file-analysis/${ANALYSIS_ID}"
            else
              echo "  Upload response: ${RESULT}"
            fi
          done

      # ── Manifest gate (#173) ──
      # Every installer ATTACHED to the release must be one the CLIENT can
      # verify: a resolvable CHECKSUMS.txt line whose digest matches the bytes
      # GitHub is serving. Since #111 the client REFUSES what it cannot verify,
      # so a defective manifest is a dead-end update — offered, downloaded,
      # blocked, on every attempt, silently until the next release.
      #
      # The script reads the assets back from the API rather than looking at
      # artifacts/. That is the whole point: `gh release upload --clobber` above
      # replaces same-named assets but never PRUNES, so a flaked build-linux on a
      # rolling re-release leaves the OLD AppImage attached while the manifest
      # regenerated from artifacts/ has no line for it. A local check cannot see
      # an asset it never produced.
      #
      # Exit 1 = the release is broken. Exit 2 = GitHub was unreachable (or the
      # digest half could not run), which is NOT a verdict on the release. That
      # distinction has to survive into the workflow, because `steps.*.outcome`
      # is only success/failure — so the code is captured as a step OUTPUT and
      # the withdraw step keys on it. Without that, a network blip would tear a
      # healthy live release out of client view.
      #
      # `!cancelled()` rather than the default `success()`: `--clobber` DELETES
      # each asset before re-uploading it ("if the upload fails, the original
      # assets will be lost" — gh's own docs), so a mid-upload failure is exactly
      # the state this gate exists to report. Defaulting to success() would skip
      # the gate precisely when it matters. It is still skipped when the publish
      # step never ran, so an earlier build failure does not end the log with a
      # gate complaining that a release it never created is missing.
      - name: Verify the client can verify every attached installer
        id: verify
        if: ${{ !cancelled() && steps.publish.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          code=0
          node scripts/verify-release-manifest.js "$TAG" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # Publication keys on whether the release is a draft RIGHT NOW, not on how
      # this run created it. Keying on `fresh` is the trap: a run that drafts and
      # then fails leaves a draft behind, the NEXT run finds it and takes the
      # re-release path (fresh=false), and the publish step never fires — a green
      # run with nothing published, repeating forever.
      - name: Publish the verified release
        id: publish_final
        if: ${{ success() && steps.verify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          # Fail CLOSED. `if [ "$(gh ...)" = "true" ]` swallows a failed command
          # substitution under `bash -e` and falls into the else branch, which
          # would log "already published" over a release that is still a draft —
          # a green job and an invisible release, the worst outcome this job has.
          STATE=$(node scripts/verify-release-manifest.js --state "$TAG") || {
            echo "::error::Verified ${TAG} but could not read its draft state, so it may be unpublished."
            exit 1
          }
          case "$STATE" in
            draft)
              gh release edit "$TAG" --draft=false
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Published $TAG — assets verified."
              ;;
            published)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "$TAG is already published — assets verified."
              ;;
            *)
              echo "::error::${TAG} verified but its state is '${STATE}' — nothing to publish."
              exit 1
              ;;
          esac

      # The rolling re-release path cannot be gated before publication: the
      # release is already live and `--clobber` mutates it in place. So on a
      # BROKEN verdict — code 1 only, never code 2 — pull it out of client view
      # rather than leave a known dead-end update on offer while someone reads
      # the log. Best-effort: if GitHub refuses to re-draft a published release
      # (immutable releases), the step still fails loudly and names the repair.
      # `!= 'true'` rather than `== 'false'`: the probe can abort before it
      # writes `fresh` at all, and a pre-existing broken live release still has
      # to be withdrawable on that path. Only a confirmed fresh create — where
      # nothing was ever live — is excluded. The body reads the real state and
      # re-drafts only what is actually published.
      - name: Withdraw an unverifiable re-release
        if: ${{ failure() && steps.verify.outputs.code == '1' && steps.publish.outputs.fresh != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          # `fresh=false` no longer implies "was published" — it is also true of
          # a leftover draft from a previous failed run. Read the real state so
          # the log does not announce that a live release was withdrawn when
          # nothing was ever live.
          STATE=$(node scripts/verify-release-manifest.js --state "$TAG") || STATE=unknown
          case "$STATE" in
            published)
              echo "::error::${TAG} failed manifest verification and is LIVE. Withdrawing it from client view."
              if gh release edit "$TAG" --draft; then
                echo "::warning::${TAG} is now a DRAFT. Repair the assets and re-run; the publish step re-publishes any draft that verifies."
              else
                echo "::error::Could not re-draft ${TAG}. Withdraw it by hand NOW: gh release edit \"$TAG\" --draft"
              fi
              ;;
            draft)
              echo "::warning::${TAG} failed manifest verification but is still a DRAFT — no client has seen it. Repair the assets and re-run."
              ;;
            *)
              echo "::error::${TAG} failed manifest verification and its state is '${STATE}'. Check it by hand."
              ;;
          esac
          exit 1

      # Failsafe. A draft is invisible to every client, so "left as a draft" is
      # a silent non-release — the one outcome that must never be reported
      # green.
      #
      # Skipped when the publish step already confirmed publication: re-reading
      # a second later would race GitHub's own consistency (release.js sleeps 3s
      # before its equivalent read) and redden a release that is live.
      # Skipped on a code-1 verdict too — the release is known-broken and the
      # gate has already said so in detail.
      # `!cancelled()` not `always()`: a cancelled run should not also collect a
      # hard red from a failsafe.
      - name: Fail if the release was left unpublished
        if: ${{ !cancelled() && steps.publish.conclusion != 'skipped' && steps.verify.outputs.code != '1' && steps.publish_final.outputs.published != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          # Fail closed: `|| echo absent` here would map a rate limit onto the
          # exit-0 branch, so the step that exists to catch a stranded draft
          # would be silent exactly when GitHub is the reason it is stranded.
          STATE=$(node scripts/verify-release-manifest.js --state "$TAG") || {
            echo "::error::Could not determine whether ${TAG} was published. Check it by hand."
            exit 1
          }
          case "$STATE" in
            published) echo "$TAG is published." ;;
            absent)    echo "::warning::No release exists for $TAG — nothing was published." ; exit 0 ;;
            *)         echo "::error::$TAG exists but is STILL A DRAFT. No client can see it."
                       echo "::error::Repair the assets and re-run, or publish by hand: gh release edit \"$TAG\" --draft=false"
                       exit 1 ;;
          esac
