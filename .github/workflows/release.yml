name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options:
          - stable
          - beta
          - dev
        default: stable
      skip_vt:
        description: 'Skip VirusTotal scan'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Build Windows installer ──
  build-windows:
    # Pinned off windows-latest: the new vs2026 image breaks @electron/node-gyp
    # (no supported Visual Studio). Same pin as ci.yml — unpin together.
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      installer: ${{ steps.version.outputs.installer }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # VS 2026-only runner images break @electron/node-gyp's VS discovery
      # (VS18 absent from its version table). Install VS2022 Build Tools —
      # also covers electron-builder's internal rebuild. See ci.yml.
      - name: Install VS2022 Build Tools
        shell: pwsh
        run: choco install visualstudio2022buildtools --no-progress -y --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre --includeRecommended --quiet --norestart"

      - name: Rebuild native modules
        shell: bash
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Run tests
        run: npx vitest run

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          CHANNEL="${{ inputs.channel }}"
          # When package.json already carries a prerelease suffix (e.g.
          # 2.0.0-beta.1 for numbered betas), the tag IS v${VERSION} — don't
          # append a second -beta. Bare versions keep the channel suffix.
          if [[ "$VERSION" == *-* ]]; then
            TAG="v${VERSION}"
          else
            case "$CHANNEL" in
              beta) TAG="v${VERSION}-beta" ;;
              dev)  TAG="v${VERSION}-dev"  ;;
              *)    TAG="v${VERSION}"      ;;
            esac
          fi
          INSTALLER="ClaudeCommandCenter-${VERSION}.exe"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "installer=${INSTALLER}" >> $GITHUB_OUTPUT
          echo "Building v${VERSION} (tag: ${TAG}, channel: ${CHANNEL})"

      - name: Build
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # exe + blockmap + latest.yml travel together: latest.yml carries the
          # exe's sha512, so replacing one without the others breaks the updater
          # (matters for rolling re-releases onto an existing tag).
          path: |
            dist/${{ steps.version.outputs.installer }}
            dist/${{ steps.version.outputs.installer }}.blockmap
            dist/latest.yml
          if-no-files-found: error

  # ── Build macOS app ──
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Rebuild native modules
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Build
        run: npm run build

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k $KEYCHAIN_PATH \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add to search list
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

          # Verify
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Package macOS DMG
        env:
          CSC_KEYCHAIN: ${{ runner.temp }}/build.keychain-db
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.ELECTRON }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg --publish never

      - name: Determine DMG filename
        id: dmg
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          echo "path=${DMG}" >> $GITHUB_OUTPUT
          echo "name=$(basename ${DMG})" >> $GITHUB_OUTPUT

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  # ── Build Linux AppImage (experimental) ──
  # Unsigned: Linux has no SmartScreen/Gatekeeper equivalent, and AppImage
  # carries no signing convention. CHECKSUMS.txt lets users verify the download
  # by hand — the in-app updater verifies every download against it (#111).
  # Built on ubuntu-latest (glibc 2.39), so the AppImage runs on distros at that
  # glibc or newer: Ubuntu 24.04+, Rocky 10+, Fedora 40+. Older lines (Rocky
  # 8/9, Ubuntu 22.04) need a container build against an older glibc — out of
  # scope for now.
  #
  # continue-on-error: this is an EXPERIMENTAL third platform, so a Linux build
  # failure must never block the Windows/macOS release. The job still shows red
  # in the run (visible to the maintainer), and release.js flags the missing
  # AppImage asset — but the release proceeds with the platforms that built.
  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Rebuild native modules
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      # The only place the vitest suite runs on Linux (CI's PR matrix is
      # Win+macOS). Note this is the standard suite — the *.native.test.ts
      # files (better-sqlite3 under Electron-as-Node) are excluded by
      # vitest.config; the native rebuild above is what proves node-pty /
      # better-sqlite3 link on linux-x64.
      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Package Linux AppImage
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

  # ── Create GitHub Release ──
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Derive the release body from src/renderer/changelog.ts (the single
      # source of truth). Empty output = no changelog entry for this version;
      # the create step then falls back to the checksums-only note.
      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.build-windows.outputs.version }}"
          node scripts/gen-changelog.js --notes "$VERSION" > RELEASE_NOTES.md || true
          if [ -s RELEASE_NOTES.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Release notes for v${VERSION}:"
            cat RELEASE_NOTES.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No changelog.ts entry for v${VERSION} - using checksums-only note."
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      # continue-on-error mirrors build-linux: if the experimental Linux build
      # failed, its artifact won't exist — download it best-effort so the
      # Windows/macOS release still publishes.
      - name: Download Linux artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build-windows.outputs.tag }}"
          VERSION="${{ needs.build-windows.outputs.version }}"
          CHANNEL="${{ inputs.channel }}"

          TITLE="${TAG}"
          case "$CHANNEL" in
            stable)
              RELEASE_NAME="Claude Command Center"
              LABEL="**Stable Release**"
              ;;
            beta)
              RELEASE_NAME="Claude Command Center Beta"
              LABEL="**Beta Release** (pre-release)"
              ;;
            dev)
              RELEASE_NAME="Claude Command Center Dev"
              LABEL="**Dev Release** (experimental)"
              ;;
            *)
              RELEASE_NAME="Claude Command Center ${CHANNEL}"
              LABEL="**${CHANNEL} Release**"
              ;;
          esac
          # Assemble the release body: title + channel label + generated notes
          # (or a checksums-only fallback), then the checksums pointer. Written
          # to a file so multi-line markdown survives intact (--notes-file).
          {
            echo "## ${RELEASE_NAME} v${VERSION}"
            echo ""
            echo "${LABEL}"
            echo ""
            if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
              cat RELEASE_NOTES.md
              echo ""
            fi
            echo "---"
            echo "SHA-256 checksums are in CHECKSUMS.txt attached to this release."
          } > RELEASE_BODY.md

          # Tag stable as latest release; beta and dev are pre-releases
          PRERELEASE_FLAG=""
          if [ "$CHANNEL" != "stable" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Rolling re-release support (v2 beta policy): if the tag's release
          # already exists, REPLACE its assets instead of failing, and leave
          # the existing hand-written release notes untouched.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists - replacing assets (rolling re-release)"
            gh release upload "${TAG}" artifacts/* --clobber
          else
            # --target pins the tag to the commit we actually built ($GITHUB_SHA
            # = the dispatched beta ref). WITHOUT it, `gh release create` tags the
            # DEFAULT branch (main), which is frozen at an old commit — GitHub then
            # derives the release's created_at from that stale commit's date, and
            # the in-app updater (which fetches releases in created_at order) never
            # sees the new beta. See src/main/github-update.ts.
            gh release create "${TAG}" $PRERELEASE_FLAG \
              --target "$GITHUB_SHA" \
              --title "${TITLE}" \
              --notes-file RELEASE_BODY.md \
              artifacts/*
          fi

      - name: VirusTotal scan
        if: ${{ !inputs.skip_vt }}
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "Skipping VT scan (no API key)"
            exit 0
          fi
          # Get upload URL for large files
          UPLOAD_URL=$(curl -s --request GET \
            --url "https://www.virustotal.com/api/v3/files/upload_url" \
            --header "x-apikey: ${VT_API_KEY}" | jq -r '.data')

          # Scan each installer (EXE + DMG + AppImage)
          for FILE in artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage; do
            [ -f "$FILE" ] || continue
            echo "Uploading $(basename $FILE) to VirusTotal..."
            RESULT=$(curl -s --request POST \
              --url "${UPLOAD_URL}" \
              --header "x-apikey: ${VT_API_KEY}" \
              --form "file=@${FILE}")
            ANALYSIS_ID=$(echo "$RESULT" | jq -r '.data.id // empty')
            if [ -n "$ANALYSIS_ID" ]; then
              echo "  VirusTotal: https://www.virustotal.com/gui/file-analysis/${ANALYSIS_ID}"
            else
              echo "  Upload response: ${RESULT}"
            fi
          done
