name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main, beta, 'release/**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Gate the test matrix on a `ci-run` label for PRs.
    # Rationale: this repo accumulates many WIP commits per PR (multi-phase v1.x
    # branches sit open for weeks while P0..PN land). Running the full Win/macOS
    # matrix on every push wastes minutes and creates red-X noise on intermediate
    # commits. Apply the `ci-run` label when the PR is ready for a real CI gate
    # (e.g. before requesting human review, before merge, or after a fix-loop).
    # Direct pushes to `main` always run CI as the final pre-merge guard.
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'ci-run')
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2025 pinned (not -latest): the windows-2025-vs2026 image that
        # windows-latest now redirects to ships ONLY Visual Studio 2026 ("18"),
        # which @electron/node-gyp cannot use yet -> better-sqlite3 rebuild fails.
        # Unpin once the electron toolchain supports VS 2026.
        os: [windows-2025, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # GitHub's 2026 Windows images ship only Visual Studio 2026 ("18"), which
      # @electron/node-gyp (fork frozen at 10.2.0-electron.2, Oct 2024) cannot
      # use: VS18 is absent from its version table, so discovery fails even in
      # VS-Command-Prompt mode. Install VS2022 Build Tools (the toolchain CI was
      # green on) until the electron toolchain learns VS 2026. ~6-8 min.
      - name: Install VS2022 Build Tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install visualstudio2022buildtools --no-progress -y --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre --includeRecommended --quiet --norestart"

      - name: Rebuild native modules
        shell: bash
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Unit tests (native / SQLite under Electron-as-Node)
        run: npm run test:unit:native

      - name: Build
        run: npm run build

      # Beta-testing artifact pipeline.
      # When a PR's source branch starts with `release/` we also produce
      # platform installers and upload them as workflow artifacts so the
      # PR's Actions run page becomes the download point for each iteration
      # of a release candidate. Signing/notarisation are skipped here —
      # CI lacks the Apple Developer ID secrets the formal release workflow
      # uses, so the macOS DMG is unsigned and Gatekeeper will warn on
      # first launch (right-click → Open). The Windows installer is also
      # unsigned, same SmartScreen warning as the release pipeline.
      - name: Package Windows installer (release/* branches only)
        if: matrix.os == 'windows-latest' && startsWith(github.head_ref, 'release/')
        run: npx electron-builder --win

      - name: Verify native modules unpacked (release/* branches only)
        if: matrix.os == 'windows-latest' && startsWith(github.head_ref, 'release/')
        run: npm run verify:package

      - name: Package macOS DMG (release/* branches only)
        if: matrix.os == 'macos-latest' && startsWith(github.head_ref, 'release/')
        run: npx electron-builder --mac

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest' && startsWith(github.head_ref, 'release/')
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS DMG
        if: matrix.os == 'macos-latest' && startsWith(github.head_ref, 'release/')
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
